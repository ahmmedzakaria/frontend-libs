<nav class="navbar navbar-expand-lg shadow-sm topbar" [class.navbar-dark]="theme === 'dark'" [class.navbar-light]="theme === 'light'">
    <div class="container-fluid px-3">
        <button class="btn btn-link me-2 nav-icon-button" (click)="toggleSidebar()" aria-label="Toggle navigation view">
            <i class="fa fa-bars fs-5"></i>
        </button>

        <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/dashboard">
            <img [src]="layoutService.applicationContext()?.branding?.logoUrl || 'assets/logo.svg'" alt="Logo" class="topbar-logo" />
            <span>{{ layoutService.applicationContext()?.branding?.applicationName || ('app.name' | translate:'NexaCore') }}</span>
        </a>

        <button
                class="navbar-toggler"
                type="button"
                (click)="toggleMobileMenu()"
                [attr.aria-expanded]="isMenuOpen"
                aria-controls="navbarNav"
                aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" [class.show]="isMenuOpen" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <app-top-navigation-renderer
                        [items]="topNavigationItems()"
                        [user]="user"
                        [theme]="theme"
                        (logout)="onLogout()"
                        (themeToggle)="toggleTheme()"
                ></app-top-navigation-renderer>
            </ul>
        </div>
    </div>
</nav>
