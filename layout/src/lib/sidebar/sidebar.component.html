<div
        class="navigation-shell"
        [class.navigation-shell--icon]="layoutService.navigationView() === 'icon'"
        (mouseleave)="closeSubmenu()"
>
    <aside class="sidebar">
        <div class="sidebar-header">
            <app-navigation-view-toggle
                    *ngIf="layoutService.layout().allowNavigationViewToggle"
                    [compact]="layoutService.navigationView() === 'icon'"
            ></app-navigation-view-toggle>
        </div>

        <nav class="navigation-list">
            <div class="navigation-message" *ngIf="loading && layoutService.navigationView() === 'detail'">
                {{ 'nav.loading_menu' | translate:'Loading menu...' }}
            </div>
            <div class="navigation-message" *ngIf="!loading && menuItems.length === 0 && layoutService.navigationView() === 'detail'">
                {{ 'nav.no_menu_available' | translate:'No menu available' }}
            </div>

            <a
                    *ngFor="let item of menuItems"
                    class="navigation-item"
                    [routerLink]="item.children?.length ? null : item.path || null"
                    routerLinkActive="active"
                    [class.selected]="selectedItem === item"
                    [class.disabled]="item.disabled"
                    (mouseenter)="openSubmenu(item)"
                    (focus)="openSubmenu(item)"
                    (click)="selectItem(item)"
                    [title]="layoutService.navigationView() === 'icon' ? item.label : null"
            >
                <i class="navigation-item__icon" [class]="item.icon || 'fa fa-circle'"></i>
                <span class="navigation-item__label" *ngIf="layoutService.navigationView() === 'detail'">
                    {{ menuLabelKey(item.label) | translate:item.label }}
                </span>
                <i
                        *ngIf="item.children?.length && layoutService.navigationView() === 'detail'"
                        class="fa fa-chevron-right navigation-item__chevron"
                ></i>
            </a>
        </nav>
    </aside>

    <app-navigation-submenu-panel [item]="selectedItem"></app-navigation-submenu-panel>
</div>
